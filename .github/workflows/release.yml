# Release when a version tag is pushed.
# https://docs.npmjs.com/trusted-publishers
# https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages#publishing-packages-to-the-npm-registry
name: release

on:
  push:
    tags:
      - v*.*.*

# 'id-token' permission needed for OIDC (https://docs.npmjs.com/trusted-publishers)
# and provenance (https://docs.npmjs.com/generating-provenance-statements)
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # Require npm 11.5.1 or later for Trusted Publishers.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - run: npm publish
