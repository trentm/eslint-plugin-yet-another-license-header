# Release when a version tag is pushed.
# https://docs.npmjs.com/trusted-publishers
# https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages#publishing-packages-to-the-npm-registry
name: release

on:
  push:
    tags:
      - v*.*.*

# 'id-token' permission needed for OIDC (https://docs.npmjs.com/trusted-publishers)
# and provenance (https://docs.npmjs.com/generating-provenance-statements)
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Require npm 11.5.1 or later for Trusted Publishers.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          # Disable caching in release workflows (https://docs.zizmor.sh/audits/#cache-poisoning).
          package-manager-cache: false

      - run: npm publish
